[project]
name = "anonymiser-ml"
version = "0.1.0"
description = "Variant 1: local ML — Tesseract OCR + rules + spaCy NER (en/uk/ru) + YuNet face detector. Offline, no cloud."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf>=1.24.10",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
    "phonenumbers>=8.13",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "uk_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/uk_core_news_sm-3.8.0/uk_core_news_sm-3.8.0-py3-none-any.whl",
    "ru_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
anonymise = "anonymiser_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anonymiser_ml"]

[tool.hatch.metadata]
allow-direct-references = true
