[project]
name = "anonymiser-noml"
version = "0.1.0"
description = "Variant 3: zero ML. Rules on PDF text layers, pixel heuristics on images."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf>=1.24.10",
    "pillow>=10.4",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
    "phonenumbers>=8.13",
]

[project.scripts]
anonymise = "anonymiser_noml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anonymiser_noml"]
